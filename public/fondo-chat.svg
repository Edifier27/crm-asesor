<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Fondo de conversación: dibujos lineales propios (salud, chat, hogar), estilo "doodle". Se repite como mosaico. -->
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <!-- corazón -->
    <path transform="translate(18 20) rotate(-12)" d="M10 17s-8-5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 18 7c0 5-8 10-8 10z"/>
    <!-- cruz médica -->
    <path transform="translate(92 14) rotate(8)" d="M7 1h6v6h6v6h-6v6H7v-6H1V7h6z"/>
    <!-- burbuja de chat -->
    <path transform="translate(160 22) rotate(-6)" d="M3 4h20a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H11l-6 5v-5H3a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z M7 11h12 M7 15h8"/>
    <!-- estrellita -->
    <path transform="translate(226 30) rotate(14)" d="M8 0l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <!-- estetoscopio -->
    <path transform="translate(40 80) rotate(10)" d="M2 1v8a6 6 0 0 0 12 0V1 M8 15v5a6 6 0 0 0 12 0v-3 M20 17a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
    <!-- casa -->
    <path transform="translate(118 78) rotate(-8)" d="M1 11L12 2l11 9 M4 9v12h16V9 M10 21v-6h4v6"/>
    <!-- pastilla -->
    <path transform="translate(192 86) rotate(35)" d="M4 1h10a4 4 0 0 1 0 8H4a4 4 0 0 1 0-8z M9 1v8"/>
    <!-- carita -->
    <path transform="translate(14 150) rotate(-10)" d="M11 21a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M7 13s1.5 3 4 3 4-3 4-3 M8 8h.01 M14 8h.01"/>
    <!-- hoja -->
    <path transform="translate(80 150) rotate(20)" d="M2 20C2 8 10 2 22 2c0 12-6 20-18 20z M2 20L14 9"/>
    <!-- reloj -->
    <path transform="translate(150 146) rotate(-4)" d="M11 21a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M11 6v5l3 2"/>
    <!-- tilde -->
    <path transform="translate(222 150) rotate(-12)" d="M1 9l6 6L19 2"/>
    <!-- burbujas chicas -->
    <path transform="translate(52 214) rotate(6)" d="M2 3h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7l-4 3v-3H2a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
    <!-- corazón chico -->
    <path transform="translate(122 214) rotate(12) scale(.75)" d="M10 17s-8-5-8-10a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 18 7c0 5-8 10-8 10z"/>
    <!-- sol -->
    <path transform="translate(182 208)" d="M10 14a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M10 1v2 M10 17v2 M1 10h2 M17 10h2 M3.6 3.6l1.4 1.4 M15 15l1.4 1.4 M3.6 16.4L5 15 M15 5l1.4-1.4"/>
    <!-- puntitos -->
    <circle cx="70" cy="56" r="1.6"/><circle cx="140" cy="54" r="1.6"/><circle cx="240" cy="110" r="1.6"/>
    <circle cx="100" cy="118" r="1.6"/><circle cx="30" cy="122" r="1.6"/><circle cx="200" cy="184" r="1.6"/>
    <circle cx="96" cy="196" r="1.6"/><circle cx="240" cy="240" r="1.6"/><circle cx="20" cy="244" r="1.6"/>
  </g>
</svg>
